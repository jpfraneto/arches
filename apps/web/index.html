<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arches</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f7f9;
        color: #15171a;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 32px;
        line-height: 1.1;
      }

      .domain {
        margin: 0;
        color: #5d6470;
      }

      form,
      .quote,
      .notice,
      .cast {
        background: #ffffff;
        border: 1px solid #dde1e7;
        border-radius: 8px;
      }

      form {
        display: grid;
        gap: 12px;
        padding: 16px;
        margin-bottom: 20px;
      }

      .notice {
        display: grid;
        gap: 6px;
        padding: 14px 16px;
        margin-bottom: 20px;
        border-color: #c7d8f2;
        background: #f4f8ff;
        color: #27384f;
      }

      .notice strong {
        color: #15171a;
      }

      .notice p {
        margin: 0;
      }

      .composer-status {
        min-height: 22px;
        margin: 0;
        color: #496179;
        font-size: 14px;
      }

      .composer-status.success {
        color: #176b5d;
      }

      .composer-status.error {
        color: #9d2b22;
      }

      .quote {
        display: grid;
        gap: 12px;
        padding: 16px;
        margin-bottom: 20px;
      }

      .quote-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }

      textarea,
      input,
      select {
        width: 100%;
        border: 1px solid #c8ced8;
        border-radius: 6px;
        padding: 10px 12px;
        font: inherit;
        background: #ffffff;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
      }

      button {
        justify-self: start;
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
        color: #ffffff;
        background: #176b5d;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .feed {
        display: grid;
        gap: 12px;
      }

      .cast {
        padding: 14px 16px;
      }

      .cast p {
        margin: 0 0 10px;
        white-space: pre-wrap;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: #667080;
        font-size: 14px;
      }

      .status {
        color: #8a4b08;
      }

      .empty,
      .error {
        color: #667080;
      }

      .quote-result {
        display: grid;
        gap: 4px;
        margin: 0;
        color: #3f4651;
      }

      .quote-total {
        color: #15171a;
        font-size: 24px;
        font-weight: 800;
      }

      @media (max-width: 640px) {
        .quote-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="arch-name">Arch</h1>
        <p class="domain" id="arch-domain"></p>
      </header>

      <section class="notice" aria-labelledby="status-title">
        <strong id="status-title">Live local Arch</strong>
        <p>
          Posts here are saved to this Arch feed and marked local. Farcaster
          account signing and publishing are not enabled yet.
        </p>
      </section>

      <form id="composer">
        <label>
          Cast
          <textarea id="text" name="text" maxlength="1024" required></textarea>
        </label>
        <label>
          .anky
          <input id="dotAnky" name="dotAnky" placeholder="optional local grammar" />
        </label>
        <button id="submit" type="submit">Post</button>
        <p class="composer-status" id="composer-status" role="status" aria-live="polite"></p>
      </form>

      <section class="quote" id="quote-section" aria-labelledby="quote-title" hidden>
        <h2 id="quote-title">Appliance quote</h2>
        <div class="quote-grid">
          <label>
            Total before discount
            <input id="subtotal" name="subtotal" type="number" min="0" step="0.01" value="100" />
          </label>
          <label>
            Payment method
            <select id="paymentMethod" name="paymentMethod">
              <option value="fiat">Standard payment</option>
              <option value="arches_coin">$ARCHES coin</option>
            </select>
          </label>
        </div>
        <p class="quote-result" id="quote-result"></p>
      </section>

      <section class="feed" id="feed" aria-live="polite"></section>
    </main>

    <script>
      const state = {
        arch: null,
        casts: [],
      };

      const archName = document.querySelector("#arch-name");
      const archDomain = document.querySelector("#arch-domain");
      const feed = document.querySelector("#feed");
      const form = document.querySelector("#composer");
      const submit = document.querySelector("#submit");
      const composerStatus = document.querySelector("#composer-status");
      const quoteSection = document.querySelector("#quote-section");
      const subtotal = document.querySelector("#subtotal");
      const paymentMethod = document.querySelector("#paymentMethod");
      const quoteResult = document.querySelector("#quote-result");

      async function loadArch() {
        const response = await fetch("/api/arch");
        if (!response.ok) throw new Error("Could not load Arch");
        state.arch = await response.json();
        archName.textContent = state.arch.slug;
        archDomain.textContent = state.arch.domain;
        document.title = state.arch.slug;

        if (state.arch.payments?.enabled) {
          quoteSection.hidden = false;
          await loadQuote();
        }
      }

      async function loadFeed() {
        const response = await fetch("/api/feed");
        if (!response.ok) throw new Error("Could not load feed");
        const payload = await response.json();
        state.casts = payload.casts ?? [];
        renderFeed();
      }

      async function loadQuote() {
        const subtotalCents = Math.round(Number(subtotal.value || 0) * 100);
        const response = await fetch("/api/quote", {
          method: "POST",
          headers: {
            "content-type": "application/json",
          },
          body: JSON.stringify({
            subtotalCents,
            paymentMethod: paymentMethod.value,
          }),
        });

        if (!response.ok) throw new Error("Could not load quote");
        const payload = await response.json();
        renderQuote(payload.quote);
      }

      function renderQuote(quote) {
        const parts = [
          textLine("Subtotal", money(quote.subtotalCents)),
          textLine("Discount", `-${money(quote.discount.amountCents)} (${quote.discount.percent}%)`),
          textLine("Token", `$${quote.discount.symbol} ${quote.discount.contractAddress}`),
        ];

        quoteResult.replaceChildren(
          ...parts,
          element("span", "quote-total", `Total ${money(quote.totalCents)}`),
        );
      }

      function textLine(label, value) {
        return element("span", "", `${label}: ${value}`);
      }

      function element(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) node.className = className;
        node.textContent = text;
        return node;
      }

      function money(cents) {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
        }).format(cents / 100);
      }

      function renderFeed() {
        if (state.casts.length === 0) {
          feed.innerHTML = '<p class="empty">No local casts yet.</p>';
          return;
        }

        feed.replaceChildren(
          ...state.casts.map((cast) => {
            const article = document.createElement("article");
            article.className = "cast";

            const text = document.createElement("p");
            text.textContent = cast.text;

            const meta = document.createElement("div");
            meta.className = "meta";
            meta.append(
              `posted via this Arch`,
              cast.fid ? `fid: ${cast.fid}` : "account: unverified local visitor",
              `status: ${cast.status}`,
              new Date(cast.createdAt).toLocaleString(),
            );

            if (cast.username) {
              meta.append(`user: ${cast.username}`);
            }

            if (cast.dotAnky) {
              meta.append(`.anky: ${cast.dotAnky}`);
            }

            article.append(text, meta);
            return article;
          }),
        );
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        composerStatus.className = "composer-status";
        composerStatus.textContent = "Posting locally to this Arch...";

        const data = new FormData(form);
        const payload = {
          text: data.get("text"),
          dotAnky: data.get("dotAnky"),
        };

        try {
          const response = await fetch("/api/casts", {
            method: "POST",
            headers: {
              "content-type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          if (!response.ok) throw new Error("Post failed");
          const result = await response.json();
          form.reset();
          await loadFeed();
          composerStatus.className = "composer-status success";
          composerStatus.textContent = `Posted locally via ${state.arch?.slug ?? "this Arch"} (${result.cast.status}). Not sent to Farcaster.`;
        } catch (error) {
          composerStatus.className = "composer-status error";
          composerStatus.textContent = "Could not post the cast.";
        } finally {
          submit.disabled = false;
        }
      });

      subtotal.addEventListener("input", () => {
        loadQuote().catch(() => {
          quoteResult.textContent = "Could not calculate the quote.";
        });
      });

      paymentMethod.addEventListener("change", () => {
        loadQuote().catch(() => {
          quoteResult.textContent = "Could not calculate the quote.";
        });
      });

      Promise.all([loadArch(), loadFeed()]).catch(() => {
        feed.innerHTML = '<p class="error">Could not connect to the Arches API.</p>';
      });
    </script>
  </body>
</html>
